server:
  port: 8080

spring:
  application:
    name: smart-healthcare
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_healthcare?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smarthealthcare.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: SmF2YVNwcmluZ0Jvb3RTbWFydEhlYWx0aGNhcmVKV1RTZWNyZXRLZXkyMDI0
  expiration: 86400000  # 24小时

# AI大模型配置(通过环境变量设置API密钥)
ai:
  llm:
    provider: openai  # openai / zhipu / qianfan
    api-key: ${AI_API_KEY:your-api-key-here}
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    model: deepseek-v4-flash

# Knife4j API文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
